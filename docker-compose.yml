version: "3.9"

services:

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ai-knowledge-backend
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    volumes:
      - ./server/data:/app/data
      - ./server/logs:/app/logs
      - ./server/exports:/app/exports
      - ./server/vector_db:/app/vector_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ai-knowledge-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./client/.env
    depends_on:
      - backend
    restart: unless-stopped
